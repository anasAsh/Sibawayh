<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sibawayh social preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Noto+Naskh+Arabic:wght@500;700&family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#14110f; --ink:#f4ede4; --muted:#a89f94; --accent:#d97757; --good:#6fcf97; --bad:#eb6f6f; --card:#1f1a17; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1280px; height:640px; background:var(--bg); color:var(--ink); overflow:hidden; }
  body { font-family:Inter, system-ui, sans-serif; position:relative; }
  .pattern { position:absolute; inset:0; opacity:.07;
    background-image:radial-gradient(circle at 1px 1px, var(--ink) 1px, transparent 0); background-size:28px 28px; }
  .glow { position:absolute; width:700px; height:700px; right:-180px; top:-260px; border-radius:50%;
    background:radial-gradient(circle, rgba(217,119,87,.35), transparent 65%); }
  .wrap { position:relative; display:flex; height:100%; padding:64px 72px; gap:56px; align-items:center; }
  .left { flex:1.05; }
  .ar { font-family:Amiri, "Noto Naskh Arabic", serif; font-weight:700; font-size:150px; line-height:1; color:var(--ink); direction:rtl; text-align:left; }
  .en { font-weight:800; font-size:56px; letter-spacing:-1px; margin-top:10px; }
  .en span { color:var(--accent); }
  .tag { font-size:27px; color:var(--muted); margin-top:18px; line-height:1.35; max-width:520px; }
  .pills { display:flex; gap:10px; margin-top:28px; flex-wrap:wrap; }
  .pill { font-family:"JetBrains Mono", monospace; font-size:17px; padding:7px 14px; border-radius:999px; border:1px solid #3a322c; color:var(--ink); background:#1b1714; }
  .right { flex:1; display:flex; flex-direction:column; gap:18px; }
  .card { background:var(--card); border:1px solid #2e2722; border-radius:18px; padding:22px 26px; }
  .label { font-size:15px; font-weight:600; letter-spacing:1.5px; text-transform:uppercase; margin-bottom:10px; }
  .bad .label { color:var(--bad); } .good .label { color:var(--good); }
  .line { font-family:"Noto Naskh Arabic", serif; font-size:29px; line-height:1.75; direction:rtl; text-align:right; }
  .bad .line mark { background:none; color:var(--bad); text-decoration:underline wavy var(--bad); text-underline-offset:8px; }
  .good .line mark { background:none; color:var(--good); }
  .arrow { text-align:center; color:var(--accent); font-size:28px; line-height:1; }
</style>
</head>
<body>
  <div class="pattern"></div>
  <div class="glow"></div>
  <div class="wrap">
    <div class="left">
      <div class="ar">سيبويه</div>
      <div class="en">Sibawayh<span>.</span></div>
      <div class="tag">Your AI writes Arabic.<br>Sibawayh makes it <b style="color:var(--ink)">correct</b> Arabic.</div>
      <div class="pills">
        <div class="pill">Agent Skill</div>
        <div class="pill">Claude Code plugin</div>
        <div class="pill">zero deps</div>
      </div>
    </div>
    <div class="right">
      <div class="card bad">
        <div class="label">✗ typical AI Arabic</div>
        <div class="line"><mark>تم إستخدام</mark> الأداة <mark>من قبل</mark> الفريق<mark>,</mark><br>والملفات <mark>الذين</mark> رفعناها <mark>موجودين</mark></div>
      </div>
      <div class="arrow">↓</div>
      <div class="card good">
        <div class="label">✓ with Sibawayh</div>
        <div class="line"><mark>استخدم</mark> الفريق الأداة<mark>،</mark><br>والملفات <mark>التي</mark> رفعناها <mark>موجودة</mark></div>
      </div>
    </div>
  </div>
</body>
</html>
