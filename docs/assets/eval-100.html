<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Sibawayh: 100-test result card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Noto+Naskh+Arabic:wght@500;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#14110f; --ink:#f4ede4; --muted:#a89f94; --accent:#d97757; --good:#6fcf97; --bad:#eb6f6f; --card:#1f1a17; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1200px; height:1200px; background:var(--bg); color:var(--ink); overflow:hidden; }
  body { font-family:"Noto Naskh Arabic", serif; position:relative; }
  .en { font-family:Inter, system-ui, sans-serif; direction:ltr; unicode-bidi:isolate; }
  .pattern { position:absolute; inset:0; opacity:.07;
    background-image:radial-gradient(circle at 1px 1px, var(--ink) 1px, transparent 0); background-size:28px 28px; }
  .glow { position:absolute; width:1100px; height:1100px; left:-320px; top:-380px; border-radius:50%;
    background:radial-gradient(circle, rgba(111,207,151,.22), transparent 65%); }
  .wrap { position:relative; height:100%; padding:72px 84px; display:flex; flex-direction:column; }
  .brand { display:flex; align-items:baseline; justify-content:space-between; }
  .brand .ar { font-family:Amiri, serif; font-weight:700; font-size:92px; line-height:1; }
  .brand .en { font-weight:800; font-size:40px; letter-spacing:-1px; }
  .brand .en span { color:var(--accent); }
  .hero { margin-top:56px; display:flex; align-items:center; gap:48px; direction:ltr; }
  .big { font-family:Inter, sans-serif; font-weight:800; font-size:300px; line-height:.9; letter-spacing:-12px; color:var(--good); }
  .big sup { font-size:120px; letter-spacing:0; vertical-align:top; position:relative; top:22px; margin-left:8px; }
  .claim { direction:rtl; text-align:right; flex:1; }
  .claim .ar { font-weight:700; font-size:62px; line-height:1.35; }
  .claim .en { display:block; font-weight:600; font-size:34px; color:var(--muted); margin-top:10px; text-align:right; }
  .was { margin-top:18px; font-size:30px; color:var(--muted); }
  .was b { color:var(--ink); font-family:Inter, sans-serif; font-weight:800; }
  .card { margin-top:48px; background:var(--card); border:1px solid #2e2722; border-radius:22px; padding:34px 40px; }
  .card h2 { font-size:30px; font-weight:500; color:var(--muted); display:flex; justify-content:space-between; }
  .card h2 .en { font-size:22px; font-weight:600; }
  .row { display:grid; grid-template-columns:230px 1fr; align-items:center; gap:22px; margin-top:22px; }
  .row .name { font-size:32px; font-weight:700; }
  .track { display:flex; align-items:center; gap:16px; }
  .bar { height:44px; border-radius:8px 0 0 8px; }
  .bar.b { width:100%; background:var(--bad); }
  .bar.s { width:4.5%; min-width:26px; background:var(--good); }
  .val { font-family:Inter, sans-serif; font-weight:800; font-size:36px; direction:ltr; }
  .row.base .track { }
  .row.base .bar { flex:1; }
  .pills { margin-top:auto; display:flex; gap:14px; flex-wrap:wrap; }
  .pill { font-size:28px; padding:10px 24px; border-radius:999px; border:1px solid #3a322c; background:#1b1714; }
  .pill b { font-family:Inter, sans-serif; font-weight:800; color:var(--accent); }
</style>
</head>
<body>
  <div class="pattern"></div>
  <div class="glow"></div>
  <div class="wrap">
    <div class="brand">
      <div class="ar">سيبويه</div>
      <div class="en">Sibawayh<span>.</span></div>
    </div>

    <div class="hero">
      <div class="big">96<sup>%</sup></div>
      <div class="claim">
        <div class="ar">أخطاء أقل في العربية التي يكتبها الذكاء الاصطناعي</div>
        <span class="en">fewer errors in AI-written Arabic</span>
        <div class="was">كانت النسبة <b dir="ltr">88%</b> في المنشور السابق</div>
      </div>
    </div>

    <div class="card">
      <h2><span>الأخطاء في كل 100 كلمة</span><span class="en">errors per 100 words</span></h2>
      <div class="row base">
        <div class="name">دون المهارة</div>
        <div class="track"><div class="bar b"></div><div class="val">2.22</div></div>
      </div>
      <div class="row">
        <div class="name">مع «سيبويه»</div>
        <div class="track"><div class="bar s"></div><div class="val">0.10</div></div>
      </div>
    </div>

    <div class="pills">
      <div class="pill"><b>100</b> اختبار</div>
      <div class="pill">تقييم آلي من نموذج آخر، <b>3</b> مرات</div>
      <div class="pill">بلا أي تصحيح زائد</div>
    </div>
  </div>
</body>
</html>
